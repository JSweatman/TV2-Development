services:
  - type: web
    name: tv2-resolver
    runtime: python
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: pip install -r src/requirements.txt
    startCommand: uvicorn app:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TV2_REPOSITORY
        value: postgres
      - key: DEFAULT_COUNTRY_CODE
        value: "1"
      - key: DATABASE_URL
        sync: false
