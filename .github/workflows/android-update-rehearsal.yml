name: android-update-rehearsal
on:
  push:
    branches: [qa/android-preview-update]
    paths: ['qa/android_update/**', '.github/workflows/android-update-rehearsal.yml']
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned official Flutter SDK
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Build two isolated test-only APKs with one disposable signer
        working-directory: TV2_flutter
        env:
          TV2_UPDATE_KEYSTORE: ${{ runner.temp }}/tv2-update-test.keystore
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name tv2 --org com.sundara.preview .
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml');s=p.read_text().replace('dev_dependencies:', 'dev_dependencies:\n  integration_test:\n    sdk: flutter');p.write_text(s)
          p=Path('android/app/build.gradle.kts');s=p.read_text();s=s.replace('android {', '''android {
              signingConfigs {
                  create("updateTest") {
                      storeFile = file(System.getenv("TV2_UPDATE_KEYSTORE"))
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes.getByName("debug") { signingConfig = signingConfigs.getByName("updateTest") }
          ''',1);p.write_text(s)
          p=Path('android/app/src/main/AndroidManifest.xml');s=p.read_text().replace('android:label="tv2"','android:label="TV2 Update TEST ONLY"');p.write_text(s)
          PY
          mkdir -p integration_test "$HOME/.android"
          cp ../qa/android_update/update_test.dart integration_test/update_test.dart
          rm -f "$TV2_UPDATE_KEYSTORE"
          keytool -genkeypair -keystore "$TV2_UPDATE_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -validity 365 -dname 'CN=TV2 TEST ONLY' >/dev/null 2>&1
          flutter pub get
          for phase in A B; do
            if [ "$phase" = A ]; then code=21; else code=22; fi
            flutter build apk --debug --target-platform android-x64 -t integration_test/update_test.dart --build-number "$code" --dart-define=UPDATE_PHASE="$phase" --dart-define=TV2_LOCAL_FIXTURE=true --dart-define=TV2_API_BASE_URL=http://127.0.0.1:54335
            cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/$phase.apk"
          done
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          for phase in A B; do
            "$tools/aapt" dump badging "$RUNNER_TEMP/$phase.apk" | sed -n '1p' | tee "$RUNNER_TEMP/$phase.identity"
            grep "package: name='com.sundara.preview.tv2'" "$RUNNER_TEMP/$phase.identity"
            "$tools/apksigner" verify --print-certs "$RUNNER_TEMP/$phase.apk" | grep 'certificate SHA-256 digest' > "$RUNNER_TEMP/$phase.cert"
            sha256sum "$RUNNER_TEMP/$phase.apk"
          done
          cmp -s "$RUNNER_TEMP/A.cert" "$RUNNER_TEMP/B.cert" || { echo "Signer mismatch; refusing installation"; exit 1; }
          echo "Verified matching test-only signer"
          grep "versionCode='21'" "$RUNNER_TEMP/A.identity"
          grep "versionCode='22'" "$RUNNER_TEMP/B.identity"
      - name: Fresh AOSP emulator without account services or snapshots
        run: |
          set -euo pipefail
          sdkbin=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          export PATH="$(dirname "$sdkbin"):$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;default;x86_64' > sdk.log 2>&1 || { tail -30 sdk.log; exit 1; }
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          export ANDROID_USER_HOME="$RUNNER_TEMP/tv2-update-avd"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n updateproof -k 'system-images;android-35;default;x86_64' -p "$ANDROID_AVD_HOME/updateproof.avd" --force
          "$ANDROID_HOME/emulator/emulator" -avd updateproof -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell dumpsys account > accounts.txt
          grep 'Accounts: 0' accounts.txt
          test -z "$(adb shell pm list packages com.google.android.gms)"
          adb shell dumpsys backup > backup.txt
          grep -E 'Backup Manager|enabled|provisioned|Current|Ancestral|restore|Restore' backup.txt || true
          # Fail closed unless no ancestral restore token is present.
          grep -Ei 'Ancestral: 0|Ancestral token: 0|Ancestral token=0' backup.txt
          grep -Ei 'Current: 0|Current token: 0|Current token=0' backup.txt
          test -z "$(adb shell pm list packages com.example.tv2)"
      - name: Create through UI, replace in place, verify through UI
        run: |
          set -euo pipefail
          python3 qa/android_update/resolver.py > resolver.log 2>&1 &
          adb reverse tcp:54335 tcp:54335
          for phase in A B; do
            adb logcat -c
            if [ "$phase" = A ]; then adb install "$RUNNER_TEMP/A.apk"; else adb install -r "$RUNNER_TEMP/B.apk"; fi
            adb shell dumpsys package com.sundara.preview.tv2 | grep -E 'versionCode=|versionName=|firstInstallTime=|lastUpdateTime='
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.sundara.preview.tv2/.MainActivity
            found=false
            for i in $(seq 1 60); do
              adb logcat -d -s flutter:I > "$RUNNER_TEMP/$phase-ui.log"
              if grep -q "TV2_UPDATE_${phase}_UI_PASS" "$RUNNER_TEMP/$phase-ui.log"; then found=true; break; fi
              sleep 2
            done
            if [ "$found" != true ]; then tail -60 "$RUNNER_TEMP/$phase-ui.log"; exit 1; fi
            grep "TV2_UPDATE_${phase}_UI_PASS" "$RUNNER_TEMP/$phase-ui.log"
            adb shell am force-stop com.sundara.preview.tv2
          done
          test -z "$(adb shell pm list packages com.example.tv2)"
          echo 'PASS: test-only same-signer update; country and both collections retained through UI. No backup/restore or physical-device proof.'
      - name: Cleanup — no APK or signer artifacts
        if: always()
        run: |
          timeout 10 adb emu kill || true
          rm -f "$RUNNER_TEMP/A.apk" "$RUNNER_TEMP/B.apk" "$HOME/.android/debug.keystore" "$RUNNER_TEMP/tv2-update-test.keystore"
          rm -rf TV2_flutter/build
