name: exact-preview-apk-launch
on:
  push:
    branches: [qa/exact-preview-apk-launch]
    paths: [.github/workflows/exact-preview-apk-launch.yml]
permissions:
  actions: read
  contents: read
jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download and verify existing APK (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/JSweatman/TV2-Development/actions/artifacts/15169037737/zip > artifact.zip
          echo 'edadf015ffa442ce42466df11a12168735844347e79e0651c8a996f213a6f85f  artifact.zip' | sha256sum -c -
          unzip -q artifact.zip -d artifact
          echo 'c495df2e108c910e197419c72b45b87e0cecad4663a24352d168101586c9a158  artifact/tv2-preview-app-debug.apk' | sha256sum -c -
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs artifact/tv2-preview-app-debug.apk
          "$tools/aapt" dump badging artifact/tv2-preview-app-debug.apk > badging.txt
          grep "package: name='com.sundara.preview.tv2'" badging.txt
          grep "native-code:.*'x86_64'" badging.txt
          grep "application-label:'TV2 Preview'" badging.txt
      - name: Install official emulator and disposable API 35 image
        run: |
          set -euo pipefail
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64' > sdk-install.log 2>&1 || { tail -40 sdk-install.log; exit 1; }
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          echo no | avdmanager create avd --name tv2fresh --package 'system-images;android-35;google_apis;x86_64' --device pixel_2 --force
          "$ANDROID_HOME/emulator/emulator" -avd tv2fresh -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect > emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          for i in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.cpu.abi
      - name: Install exact bytes and launch through launcher activity
        run: |
          set -euo pipefail
          test -z "$(adb shell pm list packages com.example.tv2)"
          adb install artifact/tv2-preview-app-debug.apk
          adb shell dumpsys package com.sundara.preview.tv2 | grep -E 'versionCode=|versionName='
          adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -n com.sundara.preview.tv2/.MainActivity
          # No listing input and no contact actions. Only first-launch directory UI.
          for i in $(seq 1 12); do
            sleep 5
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null
            if grep -Eq 'Choose.*country|Select.*country|ENTER LIST NUMBER|Retry Country|Country|United States|India' window.xml; then break; fi
          done
          adb shell pidof com.sundara.preview.tv2
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          nodes=list(E.parse('window.xml').iter('node'))
          labels=[(n.get('text','') or n.get('content-desc',''),n.get('bounds','')) for n in nodes]
          labels=[(t,b) for t,b in labels if t]
          print('First-launch accessible labels and bounds:', labels)
          assert any(any(s in t.lower() for s in ['country','enter list number','india','united states']) for t,b in labels), 'No expected country/keypad UI observed'
          print('PASS: exact APK installed and expected TV2 launch UI observed; no physical-device or contact test')
          PY
          test -z "$(adb shell pm list packages com.example.tv2)"
      - name: Bounded failure diagnostics
        if: failure()
        run: |
          tail -30 emulator.log 2>/dev/null || true
          adb logcat -d -s AndroidRuntime:E flutter:E 2>/dev/null | tail -50 || true
      - name: Stop disposable emulator
        if: always()
        run: adb emu kill || true
