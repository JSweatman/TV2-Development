name: ios-simulator-preview-build

# iOS simulator compilation on macOS. No Apple signing, keys, or physical device
# are needed. The resulting .app is NOT installable on a physical iPhone.
on:
  pull_request:
    paths:
      - 'TV2_flutter/**'
      - 'scripts/prepare_ios_simulator_preview.sh'
      - '.github/workflows/ios-simulator-preview-build.yml'
  push:
    branches:
      - main
    paths:
      - 'TV2_flutter/**'
      - 'scripts/prepare_ios_simulator_preview.sh'
      - '.github/workflows/ios-simulator-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator-preview:
    runs-on: macos-15
    timeout-minutes: 50
    defaults:
      run:
        working-directory: TV2_flutter
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate isolated iOS Preview runner
        shell: bash
        run: bash ../scripts/prepare_ios_simulator_preview.sh
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Execute platform-shared Flutter tests
        run: flutter test
      - name: Compile unsigned iOS Simulator application
        run: flutter build ios --simulator --debug
      - name: Verify preview bundle and record provenance
        shell: bash
        env:
          TV2_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          app="build/ios/iphonesimulator/Runner.app"
          [[ -d "$app" && -f "$app/Info.plist" ]] || {
            echo "::error::Compiled iOS simulator app missing"
            exit 1
          }
          bundle="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          label="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")"
          echo "iOS simulator bundle ID: $bundle"
          echo "iOS simulator display name: $label"
          [[ "$bundle" == 'com.sundara.preview.tv2' ]] || {
            echo "::error::Unexpected iOS bundle ID; refusing upload"
            exit 1
          }
          [[ "$label" == 'TV2 Preview' ]] || {
            echo "::error::Unexpected app label; refusing upload"
            exit 1
          }
          mkdir -p build/ios_preview
          zip_path="build/ios_preview/TV2-Preview-iOS-Simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"
          provenance="build/ios_preview/IOS_SIMULATOR_PROVENANCE.txt"
          {
            echo 'TV2 iOS SIMULATOR PREVIEW -- UNSIGNED, INTERNAL ONLY'
            echo 'Bundle ID: com.sundara.preview.tv2'
            echo 'Display name: TV2 Preview'
            echo 'Platform: iOS Simulator (NOT a physical iPhone)'
            echo 'No Apple developer signing or provisioning used.'
            echo 'Not an .ipa; do not attempt to install on an iPhone.'
            echo 'Native runner regenerated by flutter create in this CI run.'
            printf 'Source commit: %s\n' "$TV2_SOURCE_SHA"
            printf 'Workflow run: %s\n' "$GITHUB_RUN_ID"
            printf 'Xcode: '
            xcodebuild -version | head -n 1
            printf 'Flutter: '
            flutter --version | head -n 1
            printf 'Simulator archive SHA-256: '
            shasum -a 256 "$zip_path" | awk '{print $1}'
          } | tee "$provenance"
          {
            echo '### TV2 iOS simulator preview'
            echo 'This is an unsigned simulator-only build. No iPhone or TestFlight installation has been verified.'
            printf '%s\n' '~~~text'
            cat "$provenance"
            printf '%s\n' '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload unsigned iOS Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: tv2-ios-simulator-preview
          path: |
            TV2_flutter/build/ios_preview/TV2-Preview-iOS-Simulator.zip
            TV2_flutter/build/ios_preview/IOS_SIMULATOR_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 7
