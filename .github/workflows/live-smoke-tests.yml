name: live-smoke-tests

on:
  pull_request:
  push:
    branches:
      - main
      - live-smoke-tests

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise deployed TV2 resolver
        run: python scripts/live_smoke_test.py
