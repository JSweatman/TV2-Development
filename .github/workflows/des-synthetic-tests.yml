name: des-synthetic-tests
on:
  pull_request:
    paths:
      - 'prototypes/des_intake/**'
      - '.github/workflows/des-synthetic-tests.yml'
permissions:
  contents: read
jobs:
  synthetic-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner only
        run: python -m pip install pytest
      - name: Test disposable repository and actual loopback HTTP
        run: python -m pytest -q prototypes/des_intake
      - name: Check browser script syntax
        run: node --check prototypes/des_intake/web/app.js
      - name: Test delayed feedback using actual browser script
        run: node --test prototypes/des_intake/test_events.cjs
