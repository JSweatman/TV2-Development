name: android-isolated-preview-build

# The existing test APK was signed on temporary runners and may not update
# an older installation. This workflow makes a DIFFERENT Android package ID so
# the founder can install a preview without uninstalling or replacing TV2.
on:
  pull_request:
    paths:
      - 'TV2_flutter/**'
      - '.github/workflows/android-isolated-preview-build.yml'
  push:
    branches:
      - main
    paths:
      - 'TV2_flutter/**'
      - '.github/workflows/android-isolated-preview-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: TV2_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate isolated Android package
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --project-name tv2 --org com.sundara.preview .
          python3 - <<'PY'
          import re
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          original = manifest.read_text()
          updated, count = re.subn(
              r'android:label="[^"]+"',
              'android:label="TV2 Preview"',
              original, count=1,
          )
          if count != 1:
              raise SystemExit("Android application label not found; fail closed")
          manifest.write_text(updated)
          PY
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build isolated Android debug APK
        run: flutter build apk --debug
      - name: Verify isolated app identity and APK signature
        shell: bash
        env:
          TV2_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          build_tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools"
          aapt="$(find "$build_tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(find "$build_tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          [[ -n "$aapt" && -x "$aapt" ]] || { echo "::error::Android aapt unavailable"; exit 1; }
          [[ -n "$apksigner" && -x "$apksigner" ]] || { echo "::error::Android apksigner unavailable"; exit 1; }
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          package="$("$aapt" dump badging "$apk" | grep '^package: ' | head -n 1)"
          echo "APK identity: $package"
          if [[ "$package" != "package: name='com.sundara.preview.tv2' "* ]]; then
            echo "::error::Unexpected app ID! Refusing to publish potentially overlapping APK."
            exit 1
          fi
          "$apksigner" verify "$apk"
          preview="build/app/outputs/flutter-apk/tv2-preview-app-debug.apk"
          cp "$apk" "$preview"
          manifest="build/app/outputs/flutter-apk/PREVIEW_PROVENANCE.txt"
          {
            echo 'TV2 ISOLATED PREVIEW -- DEBUG TEST ONLY'
            echo 'Display name: TV2 Preview'
            echo 'Android package ID: com.sundara.preview.tv2'
            echo 'Does not replace existing com.example.tv2 test installation.'
            echo 'Separate app data: bookmarks/country preferences are NOT imported.'
            echo 'Signing: temporary runner-generated debug key; future PREVIEW updates are NOT guaranteed.'
            echo 'Do not uninstall or clear the existing TV2 installation.'
            printf 'Source commit: %s\n' "$TV2_SOURCE_SHA"
            printf 'Workflow run: %s\n' "$GITHUB_RUN_ID"
            printf 'APK SHA-256: '
            sha256sum "$preview" | awk '{print $1}'
            echo 'APK signing certificate:'
            "$apksigner" verify --print-certs "$preview"
          } | tee "$manifest"
          {
            echo '### TV2 isolated Android preview'
            echo 'Installs alongside the existing test app, without replacing it.'
            echo 'Temporary debug signing is not a permanent update solution.'
            printf '%s\n' '~~~text'
            cat "$manifest"
            printf '%s\n' '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload isolated TV2 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: tv2-android-isolated-preview
          path: |
            TV2_flutter/build/app/outputs/flutter-apk/tv2-preview-app-debug.apk
            TV2_flutter/build/app/outputs/flutter-apk/PREVIEW_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 7
