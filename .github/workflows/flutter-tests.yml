name: flutter-tests

on:
  pull_request:
  push:
    branches:
      - main
      - flutter-client-nid-selection

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TV2_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run Flutter tests
        run: flutter test
