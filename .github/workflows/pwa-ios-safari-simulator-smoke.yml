name: pwa-ios-safari-simulator-smoke

# Tests the *hosted PWA* in Safari on an iPhone Simulator.
# Separate from the native iOS Simulator app compilation / TestFlight path.
# This is a simulator smoke test, not physical-iPhone acceptance.
on:
  push:
    branches: [test/safari-xcui-feasibility-20261125]
    paths:
      - '.github/workflows/pwa-ios-safari-simulator-smoke.yml'
      - 'scripts/safari_xcui/**'

permissions:
  contents: read

jobs:
  safari-iphone-simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Xcode and available iPhone simulators
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available --json > "${RUNNER_TEMP}/tv2-simulators.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ['RUNNER_TEMP'], 'tv2-simulators.json')) as file:
              catalog = json.load(file)
          choices = []
          for runtime, devices in catalog.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and device.get('name', '').startswith('iPhone'):
                      choices.append((runtime, device['name'], device['udid']))
          if not choices:
              raise SystemExit('No available iPhone Simulator. Cannot claim test.')
          choices.sort(reverse=True)
          runtime, name, udid = choices[0]
          print(f'Selected iOS simulator: {name} ({runtime}), UDID {udid}')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'TV2_SIM_UDID={udid}\n')
              out.write(f'TV2_SIM_NAME={name}\n')
              out.write(f'TV2_SIM_RUNTIME={runtime}\n')
          PY

      - name: Boot iPhone Simulator and verify boot completes
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl boot "$TV2_SIM_UDID" || {
            # A device may already be booted by the runner.
            state="$(xcrun simctl list devices | grep "$TV2_SIM_UDID" || true)"
            [[ "$state" == *"(Booted)"* ]] || exit 1
          }
          xcrun simctl bootstatus "$TV2_SIM_UDID" -b
          xcrun simctl status_bar "$TV2_SIM_UDID" override --time '9:41' || true

      - name: Generate standalone XCUI test runner
        run: ruby scripts/safari_xcui/project.rb

      - name: Open Safari and exercise visible TV2 controls
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-pwa-evidence
          xcrun simctl openurl "$TV2_SIM_UDID" 'https://tv2-pwa-sundara-preview.onrender.com/'
          xcodebuild test -project TV2Safari.xcodeproj -scheme TV2Safari \
            -destination "platform=iOS Simulator,id=$TV2_SIM_UDID" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath "$RUNNER_TEMP/tv2-xcui-build" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ios-pwa-evidence/xcui.log

      - name: Collect limited screenshots
        if: always()
        shell: bash
        run: |
          mkdir -p ios-pwa-evidence
          find "$HOME/Library/Developer/CoreSimulator/Devices/$TV2_SIM_UDID/data/Containers" \
            -path '*/tmp/tv2-evidence/*.png' -exec cp {} ios-pwa-evidence/ \;

      - name: Record iOS Safari browser smoke provenance
        if: always()
        shell: bash
        env:
          TV2_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p ios-pwa-evidence
          {
            echo 'TV2 PWA — iPhone Simulator Safari smoke test'
            printf 'PWA URL: %s\n' 'https://tv2-pwa-sundara-preview.onrender.com'
            printf 'Source commit: %s\n' "$TV2_SOURCE_SHA"
            printf 'Workflow run: %s\n' "$GITHUB_RUN_ID"
            printf 'Simulator: %s (%s)\n' "${TV2_SIM_NAME:-unknown}" "${TV2_SIM_RUNTIME:-unknown}"
            echo 'Evidence: stages in xcui.log distinguish opening, control activation and lookup; NOT a real iPhone.'
            echo 'Deployed PWA source SHA: unknown; workflow SHA does not identify hosted content.'
            echo 'No contact actions. No full listing screenshot or xcresult upload. Failures remain evidence, not a pass.'
            echo 'Native TV2 iOS .app compilation is verified separately; not executed in this browser test.'
          } | tee ios-pwa-evidence/PROVENANCE.txt

      - name: Upload iOS Safari screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv2-pwa-ios-safari-simulator-evidence
          path: ios-pwa-evidence/
          if-no-files-found: error
          retention-days: 7
