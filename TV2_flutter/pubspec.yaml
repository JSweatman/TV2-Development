name: tv2
description: List Number TV2 test bed.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  # Basic player API without raising the existing SDK floor.
  video_player: '>=2.9.5 <2.10.0'
  # 2.12.2+ uses Swift APIs unavailable on CI's Xcode 16.4.
  video_player_avfoundation: '>=2.5.6 <2.12.2'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  video_player_platform_interface: ^6.3.0

flutter:
  uses-material-design: true
