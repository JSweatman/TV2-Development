services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tv2
      POSTGRES_USER: tv2
      POSTGRES_PASSWORD: tv2-local-only
    ports:
      - "5432:5432"
    volumes:
      - tv2_pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tv2 -d tv2"]
      interval: 3s
      timeout: 3s
      retries: 20

  resolver:
    build: .
    environment:
      TV2_REPOSITORY: postgres
      DATABASE_URL: postgresql://tv2:tv2-local-only@db:5432/tv2
      DEFAULT_COUNTRY_CODE: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  tv2_pgdata:
